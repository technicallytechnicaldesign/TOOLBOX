<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Run a saved custom checklist — a TOOLBOX tool." />
<title>Checklist — TOOLBOX</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"></noscript>
<link rel="stylesheet" href="checklist.css">
<style>
  .cl-editlink { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); float: right; }
  .cl-editlink:hover { color: var(--c-accent); text-decoration: underline; }
  .cl-missing { padding: 40px 0; color: var(--muted); }
  .cl-missing a { color: var(--c-accent); }
</style>
<script src="../assets/theme.js"></script>
<script src="../assets/reveal.js"></script>
</head>
<body>

<header>
  <a class="brand" href="../index.html" aria-label="TOOLBOX home">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round">
        <polygon points="50,10 85,30 85,70 50,90 15,70 15,30"/>
        <circle cx="50" cy="50" r="17"/>
      </svg>
    </span>
    <span class="wordmark">TO<b>O</b>LBOX</span>
  </a>
  <div class="meta">Checklists</div>
</header>

<main>
  <div class="shell">
    <a class="up-link" href="index.html"><span aria-hidden="true">&larr;</span> All checklists</a>
    <a class="cl-editlink" id="edit-link" href="#" hidden>Edit this checklist &rarr;</a>
    <div id="checklist-root"><!-- checklist.js renders here --></div>
  </div>
</main>

<footer>
  TOOLBOX &middot; Checklists &middot; <a href="https://github.com/technicallytechnicaldesign/TOOLBOX">github.com/technicallytechnicaldesign/TOOLBOX</a>
</footer>

<!-- Load the saved custom checklist named by ?id=<slug> from localStorage,
     hand it to the shared engine with its own persistence key. -->
<script>
(function () {
  window.CHECKLIST_SUPPRESS_AUTO = true;   // we mount manually with a custom key
  var params = new URLSearchParams(location.search);
  var id = params.get("id");
  var REG = "toolbox-checklist-defs";
  var def = null;
  try {
    var reg = JSON.parse(localStorage.getItem(REG) || "[]");
    def = reg.filter(function (d) { return d && d.id === id; })[0] || null;
  } catch (e) {}

  if (def) {
    window.CHECKLIST = def;
    window.CHECKLIST_OPTS = { key: "toolbox-checklist:custom:" + def.id };
    document.title = (def.title || "Checklist") + " — TOOLBOX";
    var edit = document.getElementById("edit-link");
    edit.href = "builder.html?id=" + encodeURIComponent(def.id);
    edit.hidden = false;
  } else {
    var root = document.getElementById("checklist-root");
    root.className = "cl-missing";
    root.innerHTML = "No saved checklist named <code>" + (id ? String(id).replace(/[<>&]/g, "") : "(none)") +
      "</code> was found in this browser. It may live on another device, or was never saved here. " +
      "<br><br><a href='index.html'>&larr; Back to all checklists</a> &middot; <a href='builder.html'>Open the builder</a>";
  }
})();
</script>
<script src="checklist.js"></script>
<script src="../assets/menu.js"></script>
</body>
</html>
