<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="A reusable technical-drawing checklist — a TOOLBOX tool. Toggle the processes your drawing uses; copy this file to start a new one." />
<title>Drawing Checklist — TOOLBOX</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"></noscript>
<!-- Skin + engine are shared: checklist.css (this folder) + checklist.js.
     To make a new checklist, copy this file, edit the CHECKLIST data block
     near the bottom, and add a tile on index.html — no CSS/JS edits. -->
<link rel="stylesheet" href="checklist.css">
<script src="../assets/theme.js"></script>
<script src="../assets/reveal.js"></script>
</head>
<body>

<header>
  <a class="brand" href="../index.html" aria-label="TOOLBOX home">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round">
        <polygon points="50,10 85,30 85,70 50,90 15,70 15,30"/>
        <circle cx="50" cy="50" r="17"/>
      </svg>
    </span>
    <span class="wordmark">TO<b>O</b>LBOX</span>
  </a>
  <div class="meta">Checklists</div>
</header>

<main>
  <div class="shell">
    <a class="up-link" href="index.html"><span aria-hidden="true">&larr;</span> All checklists</a>
    <div id="checklist-root"><!-- checklist.js renders here --></div>
  </div>
</main>

<footer>
  TOOLBOX &middot; Checklists &middot; <a href="https://github.com/technicallytechnicaldesign/TOOLBOX">github.com/technicallytechnicaldesign/TOOLBOX</a>
</footer>

<!-- ===================================================================
     THE CHECKLIST — edit this block to make a new checklist.
     Copy this whole file to checklists/<name>.html, change `id` to a new
     unique slug (it's the localStorage key), rewrite title/subtitle/fields/
     processes/sections, then add a tile for it on index.html. Items may be a
     plain string, or {label, hint, tags} — tags gate an item to a process.
     =================================================================== -->
<script>
window.CHECKLIST = {
  id: "drawing",
  title: "Drawing Checklist",
  subtitle: "A review pass for a 2D technical drawing. Toggle the processes your drawing actually uses — the rest drop out of the list and the count. This template doubles as a starter: copy the file to spin up your own.",
  fields: ["Drawing No.", "Revision", "Checked by", "Date"],
  // The toggle chips at the top. General (untagged) items always show; each
  // process section below is tagged, so switching a process off hides it.
  processes: [
    { key: "sheet-metal", label: "Sheet Metal" },
    { key: "welding",     label: "Welding" },
    { key: "machining",   label: "Machining" },
    { key: "casting",     label: "Casting" }
  ],
  sections: [
    // ---- general: always relevant, whatever the process ----
    {
      name: "Title Block & Identification",
      items: [
        "Drawing number, title and revision present and correct",
        { label: "Scale stated", hint: "and consistent across every view" },
        { label: "Units and projection angle declared", hint: "first- or third-angle symbol shown" },
        "Author, checker and approver named, with dates",
        "Sheet size and sheet N of M correct"
      ]
    },
    {
      name: "Views & Projection",
      items: [
        "Minimum set of views to fully define the part is present",
        "View alignment and projection are consistent",
        { label: "Section and detail views labelled", hint: "and cross-referenced to their parent view" },
        "Hidden detail shown only where it aids clarity",
        "No redundant or duplicated views"
      ]
    },
    {
      name: "Dimensions & Tolerances",
      items: [
        { label: "Every feature fully dimensioned", hint: "nothing double-dimensioned or missing" },
        "Datums defined; GD&T frames complete and legible",
        { label: "General tolerance block present", hint: "critical dimensions toleranced explicitly" },
        "Dimensions reference datums — no runaway tolerance stacks",
        { label: "Holes and callouts complete", hint: "diameter, depth, counterbore/countersink, quantity" }
      ]
    },
    {
      name: "Annotations & Notes",
      items: [
        { label: "General notes present", hint: "material, finish, deburr, break sharp edges" },
        "Surface-finish symbols applied where required",
        "Special processes / heat treat / coating specified",
        "No conflicting or ambiguous notes"
      ]
    },
    {
      name: "Standards & Release",
      items: [
        "Material spec and condition called out",
        "BOM / parts list matches the geometry",
        { label: "Conforms to house / ISO / ASME standard", hint: "as applicable to the drawing" },
        "Revision history updated with a change description",
        "Signed off and ready for release"
      ]
    },

    // ---- process-specific: shown only when the process is toggled on ----
    {
      name: "Sheet Metal",
      tags: ["sheet-metal"],
      items: [
        { label: "Bend radii specified", hint: "and achievable with available tooling" },
        { label: "Flat pattern / developed length given", hint: "with bend allowance or deduction" },
        "K-factor or bend-deduction basis stated",
        "Bend reliefs and notches dimensioned",
        { label: "Hole-to-bend distances adequate", hint: "no distortion near bends" },
        "Grain / rolling direction called out where it matters"
      ]
    },
    {
      name: "Welding",
      tags: ["welding"],
      items: [
        { label: "Weld symbols complete", hint: "size, type, length, contour, field/all-around" },
        "Joint preparation / bevel angles shown",
        "Weld process and filler spec noted",
        "Weld sequence / distortion control considered",
        "NDT / inspection requirements stated"
      ]
    },
    {
      name: "Machining",
      tags: ["machining"],
      items: [
        { label: "Thread callouts complete", hint: "spec, class, depth, quantity" },
        "Tight tolerances applied only where the function needs them",
        { label: "Datums accessible for work-holding", hint: "part can be fixtured to the datum scheme" },
        "Deburr / break-edge note present",
        { label: "Machining stock allowed on cast/forged faces", hint: "where a finished surface is required" }
      ]
    },
    {
      name: "Casting",
      tags: ["casting"],
      items: [
        { label: "Draft angles applied to vertical faces", hint: "for pattern/mould release" },
        "Parting line located and shown",
        { label: "Fillet and rib radii specified", hint: "no sharp internal corners" },
        "Shrinkage / machining stock allowance included",
        { label: "Casting tolerance grade called out", hint: "e.g. ISO 8062 grade" }
      ]
    }
  ]
};
</script>
<script src="checklist.js"></script>
<script src="../assets/menu.js"></script>
</body>
</html>
